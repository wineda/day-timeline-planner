<title>ペットの演出モック</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* ===== Day Timeline Planner ===== */

.workspace-leaf-content[data-type="day-timeline-planner-view"] .view-content {
  padding: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ---------- ツールバー（タイムラインの直上の1行） ---------- */
.dt-nav {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: 0 0 auto;
}

.dt-icon-btn {
  padding: 4px;
  border-radius: var(--radius-s);
  flex: 0 0 auto;
}
.dt-icon-btn:focus-visible {
  box-shadow: 0 0 0 2px var(--background-modifier-border-focus);
}

.dt-today-btn {
  font-size: var(--font-ui-small);
  padding: 2px 10px;
  height: auto;
  min-height: 0;
  line-height: 1.6;
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
/* 今日が画面に映っている間は押す意味がないので出さない（そのぶん日付に幅を回す） */
.dt-today-btn.is-hidden {
  display: none;
}
/* 「今日」のアイコン版（カレンダーの枠 + 今日の日付。TickTick 風）。
   出すのは狭い画面のときだけで、広い画面では文字の「今日」を出す */
.dt-today-icon {
  display: none;
  position: relative;
  align-items: center;
  justify-content: center;
}
.dt-today-icon svg {
  width: 20px;
  height: 20px;
}
.dt-today-num {
  position: absolute;
  /* カレンダーの枠線（上部の帯より下）の真ん中に数字を置く */
  left: 0;
  right: 0;
  top: 38%;
  bottom: 4%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  font-weight: 700;
  line-height: 1;
  pointer-events: none;
  font-variant-numeric: tabular-nums;
}

.dt-date {
  flex: 0 1 auto;
  min-width: 0;
  display: flex;
  position: relative;
}

/* 日付は「押せる月タイトル」（TickTick 風にヘッダーの主役として大きく出す）。
   塗りを持つとモードの「選択中」と見分けが付かないので、背景・枠を持たない見出しとして扱う */
.dt-date-label {
  background: transparent;
  border: none;
  box-shadow: none;
  padding: 2px 6px;
  height: auto;
  min-height: 0;
  font-size: var(--font-ui-large, 20px);
  font-weight: 700;
  line-height: 1.3;
  color: var(--text-normal);
  cursor: pointer;
  border-radius: var(--radius-s);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.dt-date-label:hover {
  background: var(--background-modifier-hover);
  box-shadow: none;
}
/* 今日が範囲に入っているかは、列ヘッダーの丸と「今日」ボタンの有無で分かる。
   ラベルまでアクセント色にすると、見ているのがたいてい今週なので常時青くなってしまう */

/* 日 / 週 の切り替え */
.dt-mode {
  display: inline-flex;
  flex: 0 0 auto;
  border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-s);
  overflow: hidden;
}
.dt-mode-btn {
  font-size: var(--font-ui-smaller);
  padding: 2px 10px;
  height: auto;
  min-height: 0;
  line-height: 1.6;
  border: none;
  border-radius: 0;
  box-shadow: none;
  background: transparent;
  color: var(--text-muted);
}
.dt-mode-btn + .dt-mode-btn {
  border-left: 1px solid var(--background-modifier-border);
}
.dt-mode-btn:hover {
  background: var(--background-modifier-hover);
  box-shadow: none;
}
.dt-mode-btn.is-active {
  background: var(--interactive-accent);
  color: var(--text-on-accent);
}

/* 表示範囲（3日・週）の予実合計（ツールバーの日付ラベルの隣） */
.dt-range-total {
  display: none;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: var(--font-ui-smaller);
  color: var(--text-muted);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.dt-range-total.is-visible {
  display: inline-block;
}

/* 狭い画面で日/3日/週/月 のセグメントの代わりに出す切替ボタン。
   TickTick 風にアイコンだけの枠なしボタンにする（いまの単位はメニュー内のチェックと
   画面の列の並びで分かる） */
.dt-mode-menu-btn {
  display: none; /* 出すのは狭い画面のときだけ（.dt-view.is-narrow で切り替える） */
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  height: auto;
  min-height: 0;
  padding: 4px 6px;
  border: none;
  border-radius: var(--radius-s);
  background: transparent;
  color: var(--icon-color, var(--text-muted));
  box-shadow: none;
  cursor: pointer;
}
.dt-mode-menu-btn:hover {
  background: var(--background-modifier-hover);
  color: var(--icon-color-hover, var(--text-normal));
  box-shadow: none;
}
.dt-mode-menu-btn svg {
  width: var(--icon-size, 18px);
  height: var(--icon-size, 18px);
}

/* 予実モードの予定バー: 輪郭 + 薄い塗りにして「枠」に見せる（実績が主役） */
.dt-event.is-plan {
  background: color-mix(in srgb, var(--dt-event-bg, var(--interactive-accent)) 16%, transparent);
  color: var(--text-normal);
  border: 1px dashed color-mix(in srgb, var(--dt-event-bg, var(--interactive-accent)) 70%, transparent);
  border-left: 3px solid var(--dt-event-bg, var(--interactive-accent));
  box-shadow: none;
}
.dt-event.is-plan .dt-event-time {
  opacity: 0.75;
}

/* 実績バー: 塗りつぶし。ドラッグ対象ではないのでクリックで編集 */
.dt-event-actual {
  cursor: pointer;
}
.dt-event-actual .dt-event-time {
  opacity: 0.85;
}

/* 他の人の予定: グレーの背景 + 左端だけその人の色 */
.dt-event.is-member {
  background: var(--background-modifier-border);
  color: var(--text-normal);
  border-left: 4px solid var(--dt-member-color, var(--text-faint));
  box-shadow: none;
}
.dt-event.is-member:hover {
  filter: none;
  background: var(--background-modifier-border-hover, var(--background-modifier-hover));
}
.dt-event.is-member .dt-event-time {
  opacity: 0.7;
}
.dt-event.is-member .dt-owner-label {
  background: var(--dt-member-color, var(--text-faint));
  color: #fff;
}
.dt-event.is-member .dt-event-ticket {
  background: rgba(0, 0, 0, 0.12);
}
.dt-month-item.is-member {
  background: var(--background-modifier-border);
  color: var(--text-normal);
  border-left: 3px solid var(--dt-member-color, var(--text-faint));
  padding-left: 4px;
}
.dt-month-item.is-member .dt-owner-label {
  background: var(--dt-member-color, var(--text-faint));
  color: #fff;
}

/* 持ち主の名前ラベル（ブロック・トレイ・月表示） */
.dt-owner-label {
  display: inline-block;
  margin-right: 5px;
  padding: 0 5px;
  border-radius: var(--radius-s);
  background: rgba(0, 0, 0, 0.22);
  font-size: 0.82em;
  line-height: 1.4;
  vertical-align: baseline;
  white-space: nowrap;
}
.dt-tray-chip .dt-owner-label {
  background: var(--background-modifier-border);
}
.dt-event.is-tiny .dt-owner-label {
  display: none;
}

/* 編集ダイアログの「誰の予定か」 */
.dt-owner-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  margin-right: 6px;
  border: 1px solid var(--background-modifier-border);
}
.dt-owner-dot.is-self {
  background: var(--interactive-accent) !important;
}

/* ヘッダーのタイマー表示 */
/* 実績を計測中のチップ（ヘッダー） */
.dt-tracking-chip {
  display: none;
  height: auto;
  min-height: 0;
  padding: 2px 10px;
  font-size: var(--font-ui-smaller);
  font-variant-numeric: tabular-nums;
  border-radius: var(--radius-l);
  background: var(--color-red);
  color: #fff;
  border: none;
  box-shadow: none;
  cursor: pointer;
  white-space: nowrap;
  max-width: 240px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dt-tracking-chip.is-visible {
  display: inline-block;
}

.dt-timer-chip {
  display: none;
  height: auto;
  min-height: 0;
  padding: 2px 10px;
  font-size: var(--font-ui-smaller);
  font-variant-numeric: tabular-nums;
  border-radius: var(--radius-l);
  background: var(--interactive-accent);
  color: var(--text-on-accent);
  border: none;
  box-shadow: none;
  cursor: pointer;
  white-space: nowrap;
}
.dt-timer-chip.is-visible {
  display: inline-block;
}
.dt-timer-chip.is-finished {
  background: var(--color-red);
  color: #fff;
  animation: dt-blink 1s steps(2, start) infinite;
}
@keyframes dt-blink {
  to {
    visibility: hidden;
  }
}

/* ステータスバー */
.dt-status-timer {
  display: none;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.dt-status-timer.is-visible {
  display: inline-block;
}

/* 日付ピッカー用の見えない input（showPicker の位置決めに使う） */
.dt-date-input {
  position: absolute;
  left: 50%;
  top: 100%;
  width: 1px;
  height: 1px;
  padding: 0;
  border: 0;
  opacity: 0;
  pointer-events: none;
}

/* ---------- 移行バナー ---------- */
.dt-banner {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  font-size: var(--font-ui-smaller);
  color: var(--text-muted);
  background: var(--background-secondary);
  border-bottom: 1px solid var(--background-modifier-border);
  flex: 0 0 auto;
}
.dt-banner.is-visible {
  display: flex;
}
.dt-banner span {
  flex: 1 1 auto;
  min-width: 0;
}
.dt-banner button {
  font-size: var(--font-ui-smaller);
  padding: 2px 10px;
  height: auto;
  min-height: 0;
}

/* ---------- 本体: 左に Inbox、右にタイムライン ---------- */
.dt-body {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: stretch;
}

/* タイムライン側（日付ナビ + スクロール領域）の入れ物 */
.dt-main {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  position: relative; /* 右下の「＋」（.dt-fab）の基準 */
}

/* ツールバー（日付ナビ・モード切替・メニュー）: タイムラインの直上に1行 */
.dt-toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px 6px;
  padding: 4px 8px;
  border-bottom: 1px solid var(--background-modifier-border);
  flex: 0 0 auto;
}
/* 左の日付グループと右のコントロール群の間の伸びる余白 */
.dt-toolbar-spacer {
  flex: 1 1 0;
}

/* ---------- Inbox（日付を決めていないタスク）: 左のサイドバー ---------- */
.dt-inbox {
  display: none;
  position: relative;
  flex-direction: column;
  flex: 0 0 220px;
  width: 220px;
  min-width: 0;
  border-right: 1px solid var(--background-modifier-border);
  background: var(--background-secondary);
  overflow: hidden;
}

/* サイドバーの右端: ドラッグで幅を変更 */
.dt-sidebar-resize {
  position: absolute;
  top: 0;
  right: 0;
  width: 5px;
  height: 100%;
  cursor: ew-resize;
  z-index: 5;
}
.dt-sidebar-resize:hover {
  background: var(--interactive-accent);
  opacity: 0.4;
}
.dt-inbox.is-visible {
  display: flex;
}
/* 畳んだときは細い帯にして、ボタンとラベルを縦に並べる */
.dt-inbox.is-collapsed {
  flex: 0 0 30px;
  width: 30px;
}
.dt-inbox-head {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 6px 6px 4px;
  border-bottom: 1px solid var(--background-modifier-border);
  flex: 0 0 auto;
}
.dt-inbox.is-collapsed .dt-inbox-head {
  flex-direction: column;
  padding: 6px 2px;
  border-bottom: none;
  gap: 6px;
}
.dt-inbox-toggle {
  flex: 0 0 auto;
}
.dt-inbox-label {
  font-size: var(--font-ui-smaller);
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  white-space: nowrap;
}
.dt-inbox.is-collapsed .dt-inbox-label {
  writing-mode: vertical-rl;
  letter-spacing: 0.1em;
}
.dt-inbox-count {
  font-size: var(--font-ui-smaller);
  color: var(--text-faint);
  background: var(--background-primary);
  border-radius: var(--radius-l);
  padding: 0 7px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
}
.dt-inbox.is-collapsed .dt-inbox-count {
  padding: 0 4px;
}
.dt-inbox-add,
.dt-inbox-open {
  flex: 0 0 auto;
}
.dt-inbox-open {
  margin-left: auto;
}
.dt-inbox.is-collapsed .dt-inbox-open {
  margin-left: 0;
}

/* パネルのタブ（Inbox ⇄ プロジェクト ⇄ 再スケジュール。2つ以上あるときだけ出る） */
.dt-panel-tabs {
  display: flex;
  align-items: stretch;
  gap: 2px;
  padding: 3px 4px 0;
  border-bottom: 1px solid var(--background-modifier-border);
  flex: 0 0 auto;
}
.dt-panel-tab {
  position: relative;
  /* 名前の長さに合わせて配分し、余りを分け合う（均等割だと長い名前だけ省略されてしまう） */
  flex: 1 1 auto;
  min-width: 0;
  text-align: center;
  font-size: 11px;
  line-height: 1.7;
  color: var(--text-muted);
  padding: 1px 2px;
  border-radius: var(--radius-s) var(--radius-s) 0 0;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  user-select: none;
  -webkit-user-select: none;
}
.dt-panel-tab:hover {
  background: var(--background-modifier-hover);
  color: var(--text-normal);
}
.dt-panel-tab.is-active {
  color: var(--text-normal);
  font-weight: 600;
  background: var(--background-primary);
  box-shadow: inset 0 -2px 0 var(--interactive-accent);
}
/* 過去に取り残された時刻なしタスクがあるとき（再スケジュールのタブ）の赤い点 */
.dt-panel-tab.has-overdue {
  padding-right: 9px; /* 点が名前に重ならないぶんの余白 */
}
.dt-panel-tab.has-overdue::after {
  content: "";
  position: absolute;
  top: 3px;
  right: 3px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--color-red, #c04545);
}

/* 1行1タスクで縦に並べる。タブで1つだけ表示するので、パネルの高さいっぱいを使う */
.dt-inbox-list {
  flex: 1 1 auto;
  min-height: 60px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 3px;
  padding: 6px;
}
.dt-inbox-list .dt-tray-empty {
  white-space: normal;
  line-height: 1.4;
}
.dt-inbox-chip {
  display: flex;
  width: 100%;
  max-width: none;
  border-radius: var(--radius-s);
  border-style: dashed;
  background: var(--background-primary);
  padding: 4px 8px 4px 6px;
}
.dt-inbox-chip .dt-tray-title {
  flex: 1 1 auto;
  white-space: normal;
  line-height: 1.3;
}
/* プロジェクトがパネルに出ていないため Inbox に出ているタスクのバッジ */
.dt-inbox-project {
  flex: 0 1 auto;
  align-self: center;
  max-width: 45%;
  padding: 0 5px;
  border-radius: var(--radius-l);
  background: var(--background-modifier-hover);
  color: var(--text-muted);
  font-size: 0.82em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}
.dt-inbox-project::before {
  content: "▸ ";
  opacity: 0.7;
}
.dt-inbox-project:hover {
  color: var(--text-normal);
  background: var(--background-modifier-border);
}

/* ---------- プロジェクトのタブの中身 ---------- */
.dt-projects {
  min-height: 60px;
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
}
.dt-projects-list {
  overflow-y: auto;
  min-height: 0;
  padding: 6px 6px 8px;
}
/* グループの見出し行（frontmatter の group で分けたプロジェクトの区切り） */
.dt-project-group {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 4px 2px;
  border-radius: var(--radius-s);
  cursor: pointer;
  user-select: none;
  color: var(--text-muted);
}
.dt-project-group:hover {
  background: var(--background-modifier-hover);
}
/* グループのアイコン（Lucide の svg か、絵文字などのテキスト） */
.dt-project-group-icon {
  display: flex;
  align-items: center;
  flex: 0 0 auto;
  font-size: 0.85em;
  line-height: 1;
}
.dt-project-group-icon svg {
  width: 14px;
  height: 14px;
}
.dt-project-group-name {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: var(--font-ui-small);
  font-weight: 600;
}
.dt-project-group-count {
  flex: 0 0 auto;
  font-size: 0.72em;
  font-variant-numeric: tabular-nums;
}
.dt-project-group-items {
  margin-left: 8px;
}
/* 設定「プロジェクトのグループ」のアイコンプレビューと入力欄 */
.dt-group-order-row .dt-group-icon-preview {
  display: inline-flex;
  align-items: center;
  margin-right: 6px;
  vertical-align: -2px;
}
.dt-group-order-row .dt-group-icon-preview svg {
  width: 16px;
  height: 16px;
}
.dt-group-order-row .dt-group-icon-input {
  width: 150px;
}
.dt-project-row {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 3px 4px;
  border-radius: var(--radius-s);
  cursor: grab;
  user-select: none;
}
.dt-project-row:hover {
  background: var(--background-modifier-hover);
}
.dt-project-row.is-dragging {
  opacity: 0.5;
}
.dt-project-chevron {
  display: flex;
  align-items: center;
  color: var(--text-muted);
  cursor: pointer;
}
.dt-project-chevron svg {
  width: 14px;
  height: 14px;
}
.dt-project-name {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: var(--font-ui-small);
}
/* プロジェクト名の Ctrl/Cmd + クリックで出すプロジェクトノートのプレビュー（ページプレビューのポップアップ）。
   ノートのタスク一覧（表）やメモが読みやすいよう、通常のプレビュー（既定 450×400px）より一回り大きくする。
   クラスは view.ts の ProjectHoverParent がポップアップに付ける（タスクブロックのプレビューは対象外） */
.popover.hover-popover.dt-project-preview {
  --popover-width: 640px;
  --popover-height: 560px;
}
.dt-project-stats {
  flex: 0 0 auto;
  font-size: 0.72em;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
/* プロジェクト自身の期日・チケット（ノートの「- 期日: 」「- チケット: 」行） */
.dt-project-due,
.dt-project-ticket {
  flex: 0 0 auto;
  font-size: 0.72em;
  color: var(--text-muted);
  border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-s);
  padding: 0 4px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  line-height: 1.5;
}
/* 期日を過ぎたプロジェクト */
.dt-project-due.is-overdue {
  color: var(--color-red, #c04545);
  border-color: color-mix(in srgb, var(--color-red, #c04545) 60%, transparent);
}
.dt-project-ticket.is-linked {
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.dt-project-ticket.is-linked:hover {
  color: var(--text-normal);
  background: var(--background-modifier-hover);
}
/* プロジェクトのドキュメント（展開したとき子タスクの上に並ぶチップ） */
.dt-project-docs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 2px 0 4px;
}
.dt-project-doc {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  max-width: 100%;
  padding: 0 6px;
  border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-l);
  font-size: var(--font-ui-smaller);
  color: var(--text-muted);
  cursor: pointer;
}
.dt-project-doc:hover {
  background: var(--background-modifier-hover);
  color: var(--text-normal);
}
.dt-project-doc-icon {
  display: flex;
}
.dt-project-doc-icon svg {
  width: 12px;
  height: 12px;
}
.dt-project-doc-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dt-project-children {
  margin: 0 0 4px 16px;
  border-left: 1px solid var(--background-modifier-border);
  padding-left: 6px;
}
.dt-project-child {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 2px 4px;
  border-radius: var(--radius-s);
  cursor: pointer;
  font-size: var(--font-ui-smaller);
}
.dt-project-child:hover {
  background: var(--background-modifier-hover);
}
/* クリックして選択中の子タスク（タイムラインの対応するブロックと同じアクセント色で結び付ける） */
.dt-project-child.is-selected {
  background: var(--background-modifier-hover);
  box-shadow: inset 3px 0 0 var(--interactive-accent);
}
.dt-project-child.is-done .dt-tray-title {
  text-decoration: line-through;
  color: var(--text-faint);
}
.dt-project-child-date {
  flex: 0 0 auto;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
/* 子タスクのタグ: タイムラインと同じ色の均一な枠と文字（日付バッジと同じ形。塗りつぶし・帯は付けない） */
.dt-project-child-tag {
  flex: 0 1 auto;
  max-width: 40%;
  padding: 0 4px;
  border: 1px solid var(--dt-chip-color, var(--text-faint));
  border-radius: var(--radius-s);
  color: var(--dt-chip-color, var(--text-muted));
  font-size: 0.9em;
  line-height: 1.5;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dt-project-child.is-done .dt-project-child-tag,
.dt-project-child-trow.is-done .dt-project-child-tag {
  opacity: 0.6;
}
/* テーブル表示のタグ列 */
.dt-projects-table .dt-ptc-tag {
  width: 1%;
  white-space: nowrap;
  padding-right: 8px;
}
.dt-projects-table td.dt-ptc-tag .dt-project-child-tag {
  max-width: 9em;
}
/* テーブル表示の子タスクの期日: 本日 = 青の●、未定 = オレンジの● */
.dt-project-child-dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  vertical-align: middle;
}
.dt-project-child-dot.is-today {
  background: var(--color-blue, #4a7fd0);
}
.dt-project-child-dot.is-undated,
.dt-project-child-dot.is-unscheduled {
  background: var(--color-orange, #e0a030);
}
/* 本日・日時が決まっていない子タスク: 枠付きのバッジ（塗りつぶすと目に付きすぎるので枠 + 色文字） */
.dt-project-child-date.is-today,
.dt-project-child-date.is-undated,
.dt-project-child-date.is-unscheduled {
  border: 1px solid var(--text-faint);
  border-radius: var(--radius-s);
  padding: 0 4px;
  font-size: 0.9em;
  line-height: 1.5;
}
/* 今日のタスクは青のバッジ（未定・遅れと色で見分けられるように） */
.dt-project-child-date.is-today {
  color: var(--color-blue, #4a7fd0);
  border-color: color-mix(in srgb, var(--color-blue, #4a7fd0) 60%, transparent);
  font-weight: 600;
}
/* 日付ごと未定はアクセント色で一段目立たせる */
.dt-project-child-date.is-undated {
  color: var(--interactive-accent);
  border-color: color-mix(in srgb, var(--interactive-accent) 55%, transparent);
}
/* 時刻未定（持ち越し・再スケジュール待ち）は遅れが分かるようオレンジで目立たせる */
.dt-project-child-date.is-unscheduled {
  color: var(--color-orange, #cf7d1e);
  border-color: color-mix(in srgb, var(--color-orange, #cf7d1e) 60%, transparent);
}
/* 過去の日に取り残されたタスク（再スケジュール欄）: 赤系でさらに目立たせる */
.dt-project-child-date.is-overdue {
  color: var(--color-red, #c04545);
  border-color: color-mix(in srgb, var(--color-red, #c04545) 60%, transparent);
}
.dt-project-child .dt-tray-title {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---------- プロジェクトのテーブル表示（期日・進捗・予定・実績を列で見比べる） ---------- */
/* リスト自体を余白なしのスクロール領域にして、表をパネルの幅いっぱいに使う */
.dt-projects-list.is-table {
  padding: 0 0 8px;
  overflow: auto; /* 列が収まらない幅では横スクロール */
}
.dt-projects-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--font-ui-small);
}
.dt-projects-table th,
.dt-projects-table td {
  padding: 3px 6px;
  white-space: nowrap;
  vertical-align: middle;
  border-bottom: 1px solid var(--background-modifier-border);
}
/* 見出し行は縦スクロールしても上に貼り付く */
.dt-projects-table thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--background-secondary);
  color: var(--text-muted);
  font-size: var(--font-ui-smaller);
  font-weight: 600;
  text-align: left;
  border-bottom: 1px solid var(--background-modifier-border);
}
/* 名前の列に余りを全部渡し、収まらない名前は省略記号にする（max-width: 0 は table のための定石） */
.dt-projects-table .dt-ptc-name {
  width: 100%;
  max-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dt-projects-table .dt-ptc-num {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.dt-projects-table td.dt-ptc-num {
  color: var(--text-muted);
}
.dt-projects-table td.dt-ptc-due .dt-project-due {
  border: none;
  padding: 0;
  font-size: 1em;
}
/* 名前セルの中身（チェブロン + 名前 + チケット）と子タスクセル（チェック + タイトル） */
.dt-ptc-name-wrap,
.dt-ptc-child {
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
}
.dt-ptc-child {
  padding-left: 14px; /* 親の名前より一段下げて、子タスクだと分かるように */
}
/* 「進捗」の列: バーの長さを行どうしで見比べられるよう、幅を固定する */
.dt-projects-table th.dt-ptc-progress,
.dt-projects-table td.dt-ptc-progress {
  width: 76px;
  min-width: 76px;
}
/* 見出しは他の列と同じく左寄せ（セルの中身はバーが幅いっぱいなので右寄せのまま） */
.dt-projects-table th.dt-ptc-progress {
  text-align: left;
}
/* タスクのステップの消化率（バー + %）。プロジェクトの行は今までどおり件数だけ出す */
.dt-progress {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 5px;
}
.dt-progress-bar {
  flex: 1 1 auto;
  min-width: 20px;
  height: 4px;
  border-radius: 2px;
  background: var(--background-modifier-border);
  overflow: hidden;
}
.dt-progress-fill {
  height: 100%;
  border-radius: 2px;
  background: var(--interactive-accent);
  transition: width 120ms ease;
}
.dt-progress-text {
  flex: 0 0 auto;
  /* 「100%」でも幅が変わらないようにして、行どうしでバーの左端・右端を揃える */
  min-width: 3em;
  text-align: right;
  color: var(--text-muted);
  font-size: var(--font-ui-smaller);
  font-variant-numeric: tabular-nums;
}
/* 全部終わったものは緑にして、ひと目で片付いたと分かるように */
.dt-progress.is-complete .dt-progress-fill {
  background: var(--color-green, #4caf50);
}
.dt-progress.is-complete .dt-progress-text {
  color: var(--color-green, #4caf50);
}
/* プロジェクトの行: ツリーと同じくつかんでタイムラインへドラッグできる */
.dt-project-trow {
  cursor: grab;
  user-select: none;
}
.dt-project-trow:hover > td {
  background: var(--background-modifier-hover);
}
.dt-project-trow.is-dragging {
  opacity: 0.5;
}
/* 子タスクの行 */
.dt-project-child-trow {
  cursor: pointer;
  font-size: var(--font-ui-smaller);
}
.dt-project-child-trow:hover > td {
  background: var(--background-modifier-hover);
}
/* クリックして選択中の子タスクの行（ツリー表示の .dt-project-child.is-selected と同じ印） */
.dt-project-child-trow.is-selected > td {
  background: var(--background-modifier-hover);
}
.dt-project-child-trow.is-selected > td:first-child {
  box-shadow: inset 3px 0 0 var(--interactive-accent);
}
.dt-project-child-trow.is-dragging {
  opacity: 0.6;
}
.dt-project-child-trow.is-done .dt-tray-title {
  text-decoration: line-through;
  color: var(--text-faint);
}
.dt-project-child-trow .dt-tray-title {
  flex: 1 1 auto;
}
/* グループの見出し行・展開中の詳細行（ドキュメント・空の案内）は表の線を出さない */
.dt-project-group-trow td {
  padding: 2px 2px 0;
  border-bottom: none;
}
.dt-project-detail-trow td {
  padding: 2px 6px 2px 20px;
  border-bottom: none;
}

/* ---------- 再スケジュールのタブの中身（時刻を決めていないタスク） ---------- */
.dt-reschedule {
  flex: 1 1 auto;
  min-height: 48px;
  overflow-y: auto;
}
.dt-reschedule-list {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 3px;
  padding: 6px;
}
.dt-reschedule-item {
  display: flex;
  width: 100%;
  max-width: none;
  border-radius: var(--radius-s);
  background: var(--background-primary);
}
.dt-reschedule-item .dt-tray-title {
  flex: 1 1 auto;
  white-space: normal;
  line-height: 1.3;
}
.dt-reschedule-item .dt-project-child-date {
  align-self: center;
}

/* ---------- 本日のサマリー（サイドバーのタブの下に常に出す） ---------- */
.dt-summary {
  flex: 0 0 auto;
  border-top: 1px solid var(--background-modifier-border);
  background: var(--background-secondary);
  font-size: var(--font-ui-smaller);
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
/* 見出し「本日 9/2 (水) … 折り返し ⌄」。クリックで畳む / 開く */
.dt-summary-head {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 8px 4px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.dt-summary-head:hover {
  background: var(--background-modifier-hover);
}
.dt-summary-title {
  font-weight: 600;
  color: var(--text-normal);
  white-space: nowrap;
}
.dt-summary-date {
  color: var(--text-faint);
  white-space: nowrap;
}
.dt-summary-brief {
  flex: 1 1 auto;
  min-width: 0;
  text-align: right;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 0.92em;
}
.dt-summary.is-complete .dt-summary-brief {
  color: var(--color-green);
  font-weight: 600;
}
.dt-summary-chevron {
  display: flex;
  flex: 0 0 auto;
  color: var(--text-faint);
}
.dt-summary-chevron svg {
  width: 14px;
  height: 14px;
}
.dt-summary-body {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 0 8px 7px;
}
.dt-summary-empty {
  white-space: normal;
  line-height: 1.4;
  color: var(--text-faint);
}

/* 件数・時間のメーター: ラベル | バー | 値 | % */
.dt-summary-meter {
  display: flex;
  align-items: center;
  gap: 6px;
}
.dt-summary-meter-label {
  flex: 0 0 3.6em;
  color: var(--text-faint);
  white-space: nowrap;
}
.dt-summary-bar {
  display: flex;
  flex: 1 1 auto;
  min-width: 24px;
  height: 8px;
  border-radius: 4px;
  background: var(--background-modifier-border);
  overflow: hidden;
}
/* タスクごとの区切り。幅は flex-grow（件数なら 1、時間なら予定の分）に比例。
   2つ目からの左端の細い線がタスクの境目（サイドバーの背景色で抜く） */
.dt-summary-seg {
  flex: 1 0 0;
  min-width: 0;
  height: 100%;
  box-sizing: border-box;
  background: var(--background-modifier-border);
}
.dt-summary-seg + .dt-summary-seg {
  border-left: 1px solid var(--background-secondary);
}
.dt-summary-seg.is-done {
  background: var(--interactive-accent);
}
.dt-summary-meter.is-complete .dt-summary-seg.is-done {
  background: var(--color-green);
}
/* 区切りが多すぎるときの1本の棒 */
.dt-summary-seg.is-plain {
  border-radius: 4px;
  transition: flex-basis 0.3s ease;
}
.dt-summary-meter-value {
  flex: 0 0 auto;
  color: var(--text-normal);
  white-space: nowrap;
}
.dt-summary-meter-pct {
  flex: 0 0 2.8em;
  text-align: right;
  white-space: nowrap;
}
.dt-summary-meter.is-complete .dt-summary-meter-pct {
  color: var(--color-green);
  font-weight: 600;
}
.dt-summary-line {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* いま / 次にやる1件 */
.dt-summary-next {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  padding: 4px 4px 4px 6px;
  border-radius: var(--radius-s);
  border: 1px solid var(--background-modifier-border);
  background: var(--background-primary);
  cursor: pointer;
}
.dt-summary-next:hover {
  background: var(--background-modifier-hover);
}
.dt-summary-next-label {
  flex: 0 0 auto;
  padding: 0 5px;
  border-radius: var(--radius-l);
  font-size: 0.85em;
  line-height: 1.5;
  background: var(--background-modifier-hover);
  color: var(--text-muted);
  white-space: nowrap;
}
.dt-summary-next.is-now .dt-summary-next-label {
  background: var(--interactive-accent);
  color: var(--text-on-accent);
}
.dt-summary-next.is-overdue .dt-summary-next-label {
  background: var(--color-red);
  color: #fff;
}
.dt-summary-next.is-unscheduled .dt-summary-next-label {
  background: transparent;
  border: 1px dashed var(--color-orange);
  color: var(--color-orange);
  line-height: 1.3;
}
.dt-summary-next-time {
  flex: 0 0 auto;
  color: var(--text-normal);
  white-space: nowrap;
}
.dt-summary-next-title {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-normal);
}
.dt-summary-next-dur {
  flex: 0 0 auto;
  color: var(--text-faint);
  white-space: nowrap;
}
.dt-summary-next-play {
  flex: 0 0 auto;
  padding: 2px;
}
/* いまのタスクのステップ（2行目）: 小さなバー + 2/4 + 次のステップ */
.dt-summary-next-steps {
  flex: 1 0 100%;
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  margin-top: 1px;
  font-size: 0.9em;
  color: var(--text-muted);
}
.dt-summary-next-steps .dt-summary-bar {
  flex: 0 0 48px;
  height: 5px;
}
.dt-summary-next-steps-count {
  flex: 0 0 auto;
  white-space: nowrap;
}
.dt-summary-next-steps-sep {
  flex: 0 0 auto;
  color: var(--text-faint);
}
.dt-summary-next-steps-next {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dt-summary-next-play svg {
  width: 14px;
  height: 14px;
}
.dt-summary-next-play.is-tracking {
  color: var(--color-red);
}

/* 連続達成と今週の棒グラフ */
.dt-summary-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 2px;
}
.dt-summary-streak {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  color: var(--text-faint);
  white-space: nowrap;
}
.dt-summary-streak.is-active {
  color: var(--color-orange);
  font-weight: 600;
}
.dt-summary-streak-icon {
  display: flex;
}
.dt-summary-streak-icon svg {
  width: 13px;
  height: 13px;
}
.dt-summary-week {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 18px;
  margin-left: auto;
}
.dt-summary-week-day {
  position: relative;
  width: 8px;
  height: 100%;
  border-radius: 2px;
  background: var(--background-modifier-border);
  overflow: hidden;
  cursor: pointer;
}
.dt-summary-week-day > div {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 0;
  border-radius: 2px;
  background: var(--text-faint);
}
.dt-summary-week-day.is-hit > div {
  background: var(--interactive-accent);
}
.dt-summary-week-day.is-today {
  box-shadow: 0 0 0 1px var(--interactive-accent);
}
.dt-summary-week-day.is-future {
  opacity: 0.4;
  cursor: default;
}
.dt-summary-week-day.is-empty {
  opacity: 0.6;
}
.dt-summary-note {
  color: var(--text-faint);
  cursor: pointer;
}
.dt-summary-note:hover {
  color: var(--text-muted);
  text-decoration: underline;
}

.dt-tray-color {
  flex: 0 0 auto;
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.dt-tray-empty {
  font-size: var(--font-ui-smaller);
  color: var(--text-faint);
  padding: 3px 0;
}

.dt-tray-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  max-width: 100%;
  padding: 2px 9px 2px 6px;
  border-radius: var(--radius-l);
  background: var(--background-secondary);
  border: 1px solid var(--background-modifier-border);
  font-size: var(--font-ui-smaller);
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
}
.dt-tray-chip:hover {
  background: var(--background-modifier-hover);
}
.dt-tray-chip.is-dragging {
  cursor: grabbing;
  opacity: 0.6;
}
.dt-tray-chip.is-done {
  opacity: 0.55;
}
.dt-tray-chip.is-done .dt-tray-title {
  text-decoration: line-through;
}

.dt-tray-check {
  display: flex;
  align-items: center;
  color: var(--text-muted);
  cursor: pointer;
}
.dt-tray-check:hover {
  color: var(--text-normal);
}
.dt-tray-check svg {
  width: 14px;
  height: 14px;
}
/* 持ち越し先で完了した [>] のチェック: 完了の印だが、ここからは切り替えない */
.dt-tray-check.is-settled-by-carry {
  cursor: default;
  opacity: 0.7;
}

.dt-tray-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}

/* ---------- 狭い画面（スマホなど）: タイムライン ⇄ パネルの切り替え ---------- */
/* 幅が足りないとサイドバーとタイムラインが共倒れになるので、
   ヘッダーの切替（is-narrow のときだけ表示）で片方だけを全面に出す。
   タイムラインとツリーの両方のアイコンを並べ、表示中の面（is-active）を色で示す。
   ヘッダーを軽く見せるため、セグメントの箱（枠・塗り）は持たせない（TickTick 風） */
.dt-pane {
  display: none;
  flex: 0 0 auto;
  align-items: center;
  gap: 2px;
}
.dt-view.is-narrow .dt-pane.is-available {
  display: inline-flex;
}
.dt-pane .dt-icon-btn {
  padding: 4px 6px;
  color: var(--text-faint);
}
/* 表示中の面はアクセント色（薄い塗り + アイコン色）で示す */
.dt-pane .dt-icon-btn.is-active,
.dt-pane .dt-icon-btn.is-active:hover {
  background: color-mix(in srgb, var(--interactive-accent) 15%, transparent);
  color: var(--interactive-accent);
}
/* タイムライン表示中はサイドバーを隠す（畳んだ細い帯も出さない） */
.dt-view.is-narrow.is-pane-timeline .dt-inbox {
  display: none;
}
/* パネル表示中はタイムライン（ツールバーごと）を隠し、サイドバーを全幅に広げる。
   タイムラインへはパネルのヘッダー左端の同じ切替で戻る（位置はツールバーと同じ） */
.dt-view.is-narrow.is-pane-panel .dt-main {
  display: none;
}
.dt-view.is-narrow.is-pane-panel .dt-inbox.is-visible {
  flex: 1 1 auto;
  width: auto;
  border-right: none;
}

/* ---------- グリッド ---------- */
.dt-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
}

/* 曜日・日付のヘッダー（週表示のみ）。スクロールしても上に残る */
.dt-day-headers {
  display: none;
  position: sticky;
  top: 0;
  z-index: 15;
  background: var(--background-primary);
  border-bottom: 1px solid var(--background-modifier-border);
  padding-right: 10px;
}
.dt-view.is-multi-day .dt-day-headers {
  display: flex;
}
/* 2週間表示: 段の見出し（幅 100%）を曜日の行の上に置くため折り返しを許す。
   曜日のまとまりは基準幅 0 にして、見出しの次の行で残り幅いっぱいに広がる（内容の幅で折り返さない） */
.dt-view.is-2week .dt-day-headers {
  flex-wrap: wrap;
}
.dt-view.is-2week .dt-day-headers-cells {
  flex-basis: 0;
}

/* ---------- 2週間表示: 今週・来週の段を上下に重ねる ----------
   段ごとに sticky なヘッダーと時間軸を持ち、列幅・文字は週表示と同じ。
   ヘッダーは段（dt-row）の中で止まり、次の段に押し出される */
.dt-row {
  position: relative;
}
.dt-view.is-2week .dt-row + .dt-row {
  border-top: 2px solid var(--background-modifier-border);
}
/* 段の見出し: 「今週  8/30〜9/5」と右端にその週の予実合計 */
.dt-week-label {
  flex: 0 0 100%;
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 4px 10px 1px 8px;
  font-size: var(--font-ui-smaller);
  line-height: 1.3;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.dt-week-label-rel {
  font-weight: 600;
  color: var(--text-normal);
}
.dt-week-label.is-current .dt-week-label-rel {
  color: var(--interactive-accent);
}
.dt-week-label-total {
  margin-left: auto;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dt-day-headers-spacer {
  flex: 0 0 52px;
  width: 52px;
}
.dt-day-headers-cells {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
}
.dt-day-header {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 3px 6px;
  border-left: 1px solid var(--background-modifier-border);
  cursor: pointer;
  color: var(--text-muted);
  line-height: 1.1;
  transition: background-color 0.12s;
}
.dt-day-header:hover {
  background: var(--background-modifier-hover);
}
/* 今日の列は面ごと薄いアクセント色にして、どの列が今日か一目で分かるようにする */
.dt-day-header.is-today {
  background: color-mix(in srgb, var(--interactive-accent) 7%, transparent);
}
.dt-day-header.is-today:hover {
  background: color-mix(in srgb, var(--interactive-accent) 13%, transparent);
}
/* 曜日 + 日付のまとまり（曜日・日付を1行ずつ中央揃えで縦に積む）。枠や背景・丸は付けず、
   文字だけの控えめな見た目にする（今日は文字色と列の薄い色で示す） */
.dt-day-header-date {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  border-radius: 999px;
}
.dt-day-header-date.is-clickable {
  cursor: pointer;
}
.dt-day-header-date.is-clickable:focus-visible {
  outline: 2px solid var(--interactive-accent);
  outline-offset: 2px;
}
/* 日付そのもののクリックは「その日の日報」。ヘッダーの他の場所（日表示へ切替）と
   区別が付くよう、ホバー・フォーカスのときだけ日付の数字の裏を薄く丸く塗る */
.dt-day-header-date.is-clickable:hover .dt-day-header-num,
.dt-day-header-date.is-clickable:focus-visible .dt-day-header-num {
  background: color-mix(in srgb, var(--interactive-accent) 18%, transparent);
  color: var(--interactive-accent);
}
.dt-day-header-date.is-clickable:active .dt-day-header-num {
  transform: scale(0.92);
}
.dt-day-header-dow {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.06em;
}
.dt-day-header-num {
  font-size: var(--font-ui-medium);
  font-weight: 600;
  color: var(--text-normal);
  font-variant-numeric: tabular-nums;
  width: 28px;
  height: 28px;
  line-height: 28px;
  text-align: center;
  border-radius: 50%;
  transition:
    background-color 0.12s,
    color 0.12s,
    transform 0.08s;
}
.dt-day-header.is-sunday .dt-day-header-dow,
.dt-day-header.is-sunday .dt-day-header-num {
  color: var(--color-red);
}
.dt-day-header.is-saturday .dt-day-header-dow,
.dt-day-header.is-saturday .dt-day-header-num {
  color: var(--color-blue);
}
/* 日付ヘッダーの予実合計。背景のピルやバーは付けず、実績と差異「14.1 +1.6」を
   小さな1行で出すだけ（超過は赤）。予定の時間そのものは幅を取るので出さない */
.dt-day-total {
  display: flex;
  align-items: baseline;
  justify-content: center;
  column-gap: 5px;
  max-width: 100%;
  min-width: 0;
  white-space: nowrap;
  font-size: 0.72em;
  line-height: 1.2;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.dt-day-total .dt-day-total-act {
  color: var(--text-normal);
  font-weight: 600;
  font-size: 1.1em;
}
.dt-day-total .dt-day-total-diff {
  font-size: 0.9em;
}
.dt-day-total .dt-day-total-diff.is-over {
  color: var(--color-red);
}

.dt-day-header.is-other-month .dt-day-header-num {
  opacity: 0.55;
}
.dt-day-header.is-today .dt-day-header-num {
  color: var(--interactive-accent);
  opacity: 1;
}
.dt-day-header.is-today .dt-day-header-dow {
  color: var(--interactive-accent);
  font-weight: 600;
}

.dt-grid {
  display: flex;
  padding: 12px 10px 24px 0;
  user-select: none;
  -webkit-user-select: none;
}

/* 日ごとの列を並べる入れ物 */
.dt-days {
  position: relative; /* 全列をまたぐ現在時刻の線（dt-now-line）の基準 */
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: flex-start;
}

.dt-labels {
  position: relative;
  width: 52px;
  flex: 0 0 52px;
}

.dt-hour-label {
  position: absolute;
  right: 8px;
  transform: translateY(-50%);
  font-size: var(--font-ui-smaller);
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.dt-canvas {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  border-left: 1px solid var(--background-modifier-border);
  cursor: default;
}
/* 週・3日表示では列が細いので、ブロック内の余白を詰める */
.dt-view.is-multi-day .dt-event {
  padding-left: 5px;
  padding-right: 4px;
}
.dt-view.is-week .dt-event-time,
.dt-view.is-2week .dt-event-time {
  font-size: 0.8em;
}

.dt-hour-line,
.dt-half-line {
  position: absolute;
  left: 0;
  right: 0;
  height: 0;
  pointer-events: none;
}
.dt-hour-line {
  border-top: 1px solid var(--background-modifier-border);
}
.dt-half-line {
  border-top: 1px dashed var(--background-modifier-border);
  opacity: 0.55;
}

.dt-events {
  position: absolute;
  inset: 0;
}

.dt-empty-hint {
  position: absolute;
  top: 10px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: var(--font-ui-smaller);
  color: var(--text-faint);
  pointer-events: none;
  padding: 0 8px;
}

/* ---------- 月表示 ---------- */
.dt-month {
  display: flex;
  flex-direction: column;
  min-height: 100%;
  padding: 0 8px 8px 8px;
}
.dt-month-weekdays {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  position: sticky;
  top: 0;
  z-index: 15;
  background: var(--background-primary);
  border-bottom: 1px solid var(--background-modifier-border);
}
.dt-month-weekday {
  text-align: center;
  font-size: var(--font-ui-smaller);
  color: var(--text-muted);
  padding: 6px 0 4px;
}
.dt-month-weekday.is-sunday {
  color: var(--color-red);
}
.dt-month-weekday.is-saturday {
  color: var(--color-blue);
}
.dt-month-grid {
  flex: 1 1 auto;
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  grid-auto-rows: minmax(96px, auto);
  border-left: 1px solid var(--background-modifier-border);
}
.dt-month-cell {
  position: relative;
  min-width: 0;
  border-right: 1px solid var(--background-modifier-border);
  border-bottom: 1px solid var(--background-modifier-border);
  padding: 2px 3px 4px;
  display: flex;
  flex-direction: column;
  cursor: pointer;
}
.dt-month-cell:hover {
  background: var(--background-modifier-hover);
}
.dt-month-cell.is-other-month {
  background: var(--background-secondary);
}
.dt-month-cell.is-other-month .dt-month-daynum,
.dt-month-cell.is-other-month .dt-month-item {
  opacity: 0.55;
}
.dt-month-cell-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 2px;
}
.dt-month-daynum {
  height: 22px;
  min-height: 0;
  min-width: 22px;
  padding: 0 5px;
  border-radius: 11px;
  background: transparent;
  border: none;
  box-shadow: none;
  font-size: var(--font-ui-small);
  font-weight: 600;
  color: var(--text-normal);
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.dt-month-daynum:hover {
  background: var(--background-modifier-hover);
  box-shadow: none;
}
.dt-month-cell.is-sunday .dt-month-daynum {
  color: var(--color-red);
}
.dt-month-cell.is-saturday .dt-month-daynum {
  color: var(--color-blue);
}
.dt-month-cell.is-today .dt-month-daynum {
  background: var(--interactive-accent);
  color: var(--text-on-accent);
}
.dt-month-add {
  opacity: 0;
  padding: 2px;
}
.dt-month-cell:hover .dt-month-add {
  opacity: 1;
}
.dt-month-add svg {
  width: 14px;
  height: 14px;
}
.dt-month-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.dt-month-item {
  display: flex;
  align-items: baseline;
  gap: 4px;
  min-width: 0;
  padding: 1px 5px;
  border-radius: var(--radius-s);
  background: var(--dt-event-bg, var(--interactive-accent));
  color: var(--dt-event-fg, var(--text-on-accent));
  font-size: var(--font-ui-smaller);
  line-height: 1.35;
  cursor: pointer;
}
.dt-month-item:hover {
  filter: brightness(1.07);
}
.dt-month-item.is-done {
  opacity: 0.5;
}
.dt-month-item.is-done .dt-month-item-ticket {
  flex: 0 0 auto;
  opacity: 0.8;
  font-size: 0.85em;
  font-variant-numeric: tabular-nums;
}

.dt-month-item-title {
  text-decoration: line-through;
}
.dt-month-item.is-unscheduled {
  background: transparent;
  color: var(--text-normal);
  border: 1px dashed var(--dt-event-bg, var(--background-modifier-border));
}
.dt-month-item.is-recurring-preview {
  background: transparent;
  color: var(--text-faint);
  border: 1px dotted var(--background-modifier-border);
  cursor: default;
}
/* エディタのカーソルが乗っているタスク / パネルでクリックして選んだタスク */
.dt-month-item.is-active-in-note,
.dt-month-item.is-selected {
  box-shadow:
    0 0 0 2px var(--background-primary),
    0 0 0 4px var(--interactive-accent);
}
.dt-month-item-time {
  flex: 0 0 auto;
  font-variant-numeric: tabular-nums;
  opacity: 0.85;
  font-size: 0.9em;
}
.dt-month-item-ticket {
  flex: 0 0 auto;
  opacity: 0.8;
  font-size: 0.85em;
  font-variant-numeric: tabular-nums;
}

.dt-month-item-title {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---------- 予定ブロック ---------- */
.dt-event {
  position: absolute;
  box-sizing: border-box;
  overflow: hidden;
  /* ブロックの実幅（列幅 ÷ 重なりレーン数）でタイトル以外を隠す判定をするための基準
     （下の @container。幅は明示指定なので inline-size containment の影響はない） */
  container-type: inline-size;
  border-radius: var(--radius-s);
  background: var(--dt-event-bg, var(--interactive-accent));
  color: var(--dt-event-fg, var(--text-on-accent));
  border-left: 3px solid rgba(0, 0, 0, 0.22);
  padding: 3px 6px 3px 7px;
  font-size: var(--font-ui-smaller);
  line-height: 1.25;
  cursor: grab;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
  transition: filter 80ms ease, box-shadow 80ms ease;
}
.dt-event:hover {
  filter: brightness(1.07);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
  z-index: 3;
}
.dt-event.is-dragging {
  cursor: grabbing;
  opacity: 0.92;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
  z-index: 20;
  transition: none;
}
/* 別の日の列へドラッグ中 */
.dt-event.is-moving-day {
  outline: 2px dashed var(--text-on-accent);
  outline-offset: -2px;
}
.dt-event.is-done {
  opacity: 0.55;
}
.dt-event.is-done .dt-event-title {
  text-decoration: line-through;
}
/* エディタのカーソルが乗っているタスク / パネル（プロジェクト一覧）でクリックして選んだタスク */
.dt-event.is-active-in-note,
.dt-event.is-selected {
  box-shadow:
    0 0 0 2px var(--background-primary),
    0 0 0 4px var(--interactive-accent);
  z-index: 4;
}
/* パネルで選んだ直後: 輪を2回またたかせて、どのブロックかを目で追えるようにする */
.dt-event.is-just-selected,
.dt-month-item.is-just-selected {
  animation: dt-selected-pulse 0.7s ease-out 2;
}
@keyframes dt-selected-pulse {
  0%,
  100% {
    box-shadow:
      0 0 0 2px var(--background-primary),
      0 0 0 4px var(--interactive-accent);
  }
  50% {
    box-shadow:
      0 0 0 2px var(--background-primary),
      0 0 0 8px color-mix(in srgb, var(--interactive-accent) 45%, transparent);
  }
}

.dt-event-time {
  font-size: 0.86em;
  opacity: 0.85;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  margin-top: 1px;
}
.dt-event-title {
  font-weight: 400;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
}
.dt-event-preview {
  opacity: 0.8;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 0.92em;
}
.dt-event.is-short .dt-event-preview {
  display: none;
}
.dt-event-condition {
  opacity: 0.95;
}

/* 高さが足りないときは 1 行にまとめる */
.dt-event.is-short {
  display: flex;
  align-items: center;
  gap: 6px;
  padding-top: 0;
  padding-bottom: 0;
}
.dt-event.is-short .dt-event-title {
  display: block;
  white-space: nowrap;
  min-width: 0;
  flex: 0 1 auto;
}
.dt-event.is-short .dt-event-time {
  margin-top: 0;
  margin-left: auto;
}
.dt-event.is-tiny {
  line-height: 1;
  padding-top: 0;
  padding-bottom: 0;
}
.dt-event.is-tiny .dt-event-time {
  display: none;
}

.dt-event-ticket {
  display: inline-block;
  align-self: flex-start;
  margin-top: 2px;
  padding: 0 6px;
  border-radius: var(--radius-l);
  background: rgba(0, 0, 0, 0.25);
  font-size: 0.82em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.dt-event-ticket.is-linked {
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.dt-event-ticket.is-linked:hover {
  background: rgba(0, 0, 0, 0.4);
}
.dt-event.is-short .dt-event-ticket {
  margin-top: 0;
}
.dt-event.is-tiny .dt-event-ticket {
  display: none;
}

/* プロジェクト（大きなタスク）のバッジ。クリックでノートを開く */
.dt-event-project {
  display: inline-block;
  align-self: flex-start;
  margin-top: 2px;
  padding: 0 6px;
  border-radius: var(--radius-l);
  background: rgba(0, 0, 0, 0.25);
  font-size: 0.82em;
  white-space: nowrap;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}
.dt-event-project::before {
  content: "▸ ";
  opacity: 0.7;
}
.dt-event-project:hover {
  background: rgba(0, 0, 0, 0.4);
}
.dt-event.is-short .dt-event-project,
.dt-event.is-tiny .dt-event-project {
  display: none;
}

/* 持ち越し済み [>] のブロック: その日の記録としてグレーで残す */
.dt-event.is-forwarded {
  opacity: 0.55;
  border-left-style: dashed;
}
.dt-forward-mark {
  opacity: 0.9;
}
.dt-month-item.is-forwarded {
  opacity: 0.55;
}
/* 持ち越し元・先のリンクバッジ */
.dt-event-carry {
  display: inline-block;
  align-self: flex-start;
  margin-top: 2px;
  padding: 0 6px;
  border-radius: var(--radius-l);
  background: rgba(0, 0, 0, 0.18);
  font-size: 0.78em;
  white-space: nowrap;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}
.dt-event-carry:hover {
  background: rgba(0, 0, 0, 0.35);
}
.dt-event.is-short .dt-event-carry,
.dt-event.is-tiny .dt-event-carry {
  display: none;
}

/* 編集ダイアログの「＋ 新規作成…」の入力欄 */
.dt-modal .dt-prompt-input {
  width: 100%;
}
.dt-modal .dt-project-new {
  display: none;
  width: 200px;
}
.dt-modal .dt-project-new.is-visible {
  display: inline-block;
}

.dt-event-resize {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 7px;
  cursor: ns-resize;
}
.dt-event.is-tiny .dt-event-ticket {
  display: inline-block;
  align-self: flex-start;
  margin-top: 2px;
  padding: 0 6px;
  border-radius: var(--radius-l);
  background: rgba(0, 0, 0, 0.25);
  font-size: 0.82em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.dt-event-ticket.is-linked {
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.dt-event-ticket.is-linked:hover {
  background: rgba(0, 0, 0, 0.4);
}
.dt-event.is-short .dt-event-ticket {
  margin-top: 0;
}
.dt-event.is-tiny .dt-event-ticket {
  display: none;
}

.dt-event-resize {
  height: 4px;
}

/* 幅の狭いブロック（スマホの週表示・重なりで分割されたレーンなど）は、
   タスク名を最優先にして時刻・バッジ類を出さない（TickTick 方式）。
   時刻 "10:00 - 11:30" が収まらない幅では出しても読めないので丸ごと隠し、
   空いた行をタイトルに使う。ここのセレクタは上の .is-tiny 等の個別指定より
   後勝ち・同等以上の詳細度になるようにしてある */
@container (max-width: 84px) {
  .dt-event .dt-event-time,
  .dt-event .dt-event-ticket,
  .dt-event .dt-event-project,
  .dt-event .dt-event-carry,
  .dt-event.is-short .dt-event-time,
  .dt-event.is-tiny .dt-event-ticket {
    display: none;
  }
  /* 時刻を出さないぶん、タイトルの行数制限を緩めて縦に長く見せる */
  .dt-event .dt-event-title {
    -webkit-line-clamp: 8;
  }
}

/* 重なりで分割されてさらに狭くなったレーン（モバイルの週表示で2つ重なった時など）は
   1行に1文字ずつの縦積みになる。左の縦線と左右の余白が文字の幅を食って
   右半分が欠けていたので、線と余白を削って文字を中央に揃え、縦書き風に読めるようにする。
   注: @container はブロック自身の幅では判定できない（コンテナは祖先を見る仕様）ので、
   is-lane-narrow クラスは描画時にレーンの実幅を測って JS 側で付けている */
.dt-event.is-lane-narrow {
  border-left: none;
  padding-left: 2px;
  padding-right: 2px;
}
/* 他の人の予定の色線は、幅を食わない上端の線に置き換えて区別を残す */
.dt-event.is-lane-narrow.is-member {
  border-top: 3px solid var(--dt-member-color, var(--text-faint));
}
.dt-event.is-lane-narrow .dt-event-title {
  text-align: center;
  word-break: break-all;
  -webkit-line-clamp: 24;
}
/* 高さが低いブロックも 1 行 1 文字で折り返して欠けないようにする */
.dt-event.is-lane-narrow.is-short .dt-event-title {
  white-space: normal;
}
.dt-event.is-lane-narrow .dt-event-preview,
.dt-event.is-lane-narrow .dt-owner-label {
  display: none;
}

/* ドラッグ選択中の仮ブロック */
.dt-ghost {
  position: absolute;
  left: 2px;
  right: 2px;
  box-sizing: border-box;
  border-radius: var(--radius-s);
  background: hsla(var(--accent-h), var(--accent-s), var(--accent-l), 0.28);
  border: 1px dashed var(--interactive-accent);
  color: var(--text-normal);
  font-size: var(--font-ui-smaller);
  font-variant-numeric: tabular-nums;
  padding: 2px 6px;
  pointer-events: none;
  z-index: 5;
  overflow: hidden;
}

/* 現在時刻ライン（TickTick 風）: 全列をまたぐ細い線 + 今日の列だけ太い線と● + 左の目盛りに時刻 */
.dt-now-line {
  position: absolute;
  left: 0;
  right: 0;
  height: 0;
  border-top: 1px solid var(--color-red);
  opacity: 0.55;
  z-index: 9;
  pointer-events: none;
}
.dt-now {
  position: absolute;
  left: 0;
  right: 0;
  height: 0;
  border-top: 2px solid var(--color-red);
  z-index: 10;
  pointer-events: none;
}
.dt-now::before {
  content: "";
  position: absolute;
  left: -5px;
  top: -6px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--color-red);
}
.dt-now-label {
  position: absolute;
  right: 4px;
  transform: translateY(-50%);
  padding: 1px 4px;
  border-radius: var(--radius-s);
  background: var(--color-red);
  color: #fff;
  font-size: var(--font-ui-smaller);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
  z-index: 10;
  pointer-events: none;
}
/* 現在時刻のラベルと重なる時刻の目盛りは隠す */
.dt-hour-label.is-near-now {
  visibility: hidden;
}

/* ---------- モーダル ---------- */
.dt-modal .setting-item {
  border-top: none;
  padding: 8px 0;
}
.dt-modal .dt-title-input {
  width: 100%;
  min-width: 220px;
}
.dt-modal .dt-time-input {
  width: 92px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.dt-modal .dt-date-field {
  width: 150px;
  font-variant-numeric: tabular-nums;
}
.dt-modal .dt-actual-input {
  width: 240px;
  font-variant-numeric: tabular-nums;
}
/* タイトル行の右端に出す「完了」トグル */
.dt-modal .dt-done-inline {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 0 0 auto;
  margin-left: 4px;
}
.dt-modal .dt-done-inline-label {
  color: var(--text-muted);
  font-size: var(--font-ui-smaller);
}
/* 「時間」の直下に「実績」を詰めて出す */
.dt-modal .setting-item.dt-tight {
  padding-top: 0;
}
/* 2つの欄を横に並べる行 */
.dt-modal .dt-row-pair {
  display: flex;
  gap: 16px;
}
.dt-modal .dt-row-pair .setting-item {
  flex: 1 1 50%;
  min-width: 0;
}
.dt-modal .dt-row-pair .setting-item-control {
  flex-wrap: wrap;
  justify-content: flex-end;
}
/* 空の任意項目は「＋」チップで開くまで隠す */
.dt-modal .dt-collapsed {
  display: none !important;
}
.dt-modal .dt-add-fields {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
  padding: 8px 0 2px;
  border-top: 1px solid var(--background-modifier-border);
}
.dt-modal .dt-add-field-chip {
  height: auto;
  min-height: 0;
  padding: 2px 10px;
  border-radius: var(--radius-l);
  font-size: var(--font-ui-smaller);
  background: transparent;
  color: var(--text-muted);
  border: 1px dashed var(--background-modifier-border-hover);
  box-shadow: none;
  cursor: pointer;
}
.dt-modal .dt-add-field-chip:hover {
  color: var(--text-normal);
  border-color: var(--interactive-accent);
  background: var(--background-modifier-hover);
}
/* 選択中のタグの「候補」フィールドのチップ（先頭に並ぶ）は少し目立たせる */
.dt-modal .dt-add-field-chip.is-suggested {
  color: var(--text-normal);
  border-style: solid;
  border-color: var(--interactive-accent);
}
/* タグ別スキーマで必須になった欄のラベルのマーク */
.dt-required-mark {
  color: var(--color-red, #e06c75);
  margin-left: 4px;
  font-size: 0.7em;
  vertical-align: 2px;
}
/* 必須なのに空のまま保存しようとした欄 */
.dt-modal .setting-item.dt-field-invalid,
.dt-modal .dt-steps.dt-field-invalid {
  box-shadow: inset 3px 0 0 var(--color-red, #e06c75);
  padding-left: 8px;
  border-radius: var(--radius-s);
}
.dt-modal .dt-tag-setting .setting-item-control {
  flex-wrap: wrap;
  justify-content: flex-start;
  flex-direction: column;
  align-items: stretch;
}
/* タグ欄の「文言一覧」リンク */
.dt-modal .dt-tag-ph-link {
  margin-left: 8px;
  font-size: var(--font-ui-smaller);
  font-weight: normal;
  color: var(--text-accent);
  text-decoration: none;
  border-bottom: 1px dotted var(--text-accent);
}
/* サブタグの段（親タグを選ぶと出る） */
.dt-modal .dt-tag-subs {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
  padding: 6px 8px;
  border-radius: var(--radius-m);
  background: var(--background-secondary);
}
.dt-modal .dt-tag-subs.is-hidden,
.dt-modal .dt-tag-hint.is-hidden,
.dt-modal .dt-status-reason.is-hidden,
.dt-modal .dt-modal-pane.is-hidden {
  display: none;
}
.dt-modal .dt-tag-subs-lead {
  font-size: var(--font-ui-smaller);
  color: var(--text-muted);
  margin-right: 4px;
}
.dt-modal .dt-tag-hint {
  font-size: var(--font-ui-smaller);
  color: var(--text-muted);
  margin-top: 4px;
}
/* 「記録 / 作業メモ」タブ */
.dt-modal .dt-modal-tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--background-modifier-border);
  margin-bottom: 4px;
}
.dt-modal .dt-modal-tab {
  height: auto;
  min-height: 0;
  padding: 8px 12px;
  background: transparent;
  border: 0;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  box-shadow: none;
  color: var(--text-muted);
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.dt-modal .dt-modal-tab.is-active {
  color: var(--text-normal);
  border-bottom-color: var(--interactive-accent);
}
.dt-modal .dt-modal-tab-sub {
  font-size: var(--font-ui-smaller);
  font-weight: normal;
  color: var(--text-muted);
}
.dt-modal .dt-modal-tab-badge {
  font-size: var(--font-ui-smaller);
  background: var(--background-modifier-hover);
  border-radius: var(--radius-l);
  padding: 0 7px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.dt-modal .dt-modal-tab-badge:empty {
  display: none;
}
.dt-modal .dt-memo-lead {
  font-size: var(--font-ui-smaller);
  color: var(--text-muted);
  margin: 8px 0 4px;
  line-height: 1.6;
}
/* ラベル横の小さな補足（判断: PLとして / 他者: 相手のボール） */
.dt-modal .dt-field-note {
  margin-left: 6px;
  font-size: var(--font-ui-smaller);
  font-weight: normal;
  color: var(--text-muted);
}
/* 欄の下の注意（記録チェックで指摘される条件） */
.dt-modal .setting-item-description.dt-desc-warn {
  color: var(--color-orange, #d9a21b);
}
/* 状態: 中断のときだけ出る理由欄 */
.dt-modal .dt-status-setting .setting-item-control {
  flex-wrap: wrap;
}
.dt-modal .dt-status-reason {
  margin-top: 6px;
  flex-basis: 100%;
}
/* 他者: 相手 + 内容の行 */
.dt-modal .dt-others-setting .setting-item-control {
  justify-content: flex-start;
}
.dt-modal .dt-others {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 100%;
}
.dt-modal .dt-others-row {
  display: grid;
  grid-template-columns: 120px minmax(0, 1fr) 28px;
  gap: 6px;
  align-items: center;
}
.dt-modal .dt-others-row input {
  width: 100%;
}
.dt-modal .dt-others-del {
  height: auto;
  min-height: 0;
  padding: 4px;
  background: transparent;
  border: 0;
  box-shadow: none;
  color: var(--text-muted);
  cursor: pointer;
}
.dt-modal .dt-others-del:hover {
  color: var(--color-red, #e06c75);
}
.dt-modal .dt-others-add {
  align-self: flex-start;
  height: auto;
  min-height: 0;
  padding: 3px 9px;
  font-size: var(--font-ui-smaller);
  background: transparent;
  border: 1px solid var(--background-modifier-border);
  box-shadow: none;
  color: var(--text-muted);
  cursor: pointer;
}
/* 未完了セット（Owner・期限・完了条件・次アクション） */
.dt-modal .dt-open-set {
  margin: 8px 0 2px;
  padding: 8px 12px 2px;
  border: 1px dashed var(--background-modifier-border-hover);
  border-radius: var(--radius-m);
  background: var(--background-secondary);
}
.dt-modal .dt-open-set-head {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  font-size: var(--font-ui-smaller);
  color: var(--text-muted);
}
.dt-modal .dt-open-set-title {
  letter-spacing: 0.08em;
  font-weight: 500;
}
/* 「その他 N」チップ（候補以外の欄をまとめて畳む） */
.dt-modal .dt-add-field-more {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border-style: solid;
}
.dt-modal .dt-add-field-more.is-open {
  color: var(--text-normal);
  background: var(--background-modifier-hover);
}
.dt-modal .dt-add-field-more-icon svg {
  width: 12px;
  height: 12px;
  transition: transform 0.15s;
}
.dt-modal .dt-add-field-more.is-open .dt-add-field-more-icon svg {
  transform: rotate(180deg);
}
.dt-modal .dt-add-field-more-count {
  font-size: 0.85em;
  background: var(--background-modifier-hover);
  border-radius: var(--radius-l);
  padding: 0 6px;
}
.dt-modal .dt-add-field-more-box {
  flex-basis: 100%;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px 10px;
  border-radius: var(--radius-m);
  background: var(--background-secondary);
}
/* 完了ポップアップ: チェック済みのステップから結果の下書き */
.dt-retro-from-steps {
  height: auto;
  min-height: 0;
  margin-top: 4px;
  padding: 2px 9px;
  font-size: var(--font-ui-smaller);
  background: transparent;
  border: 1px solid var(--background-modifier-border);
  box-shadow: none;
  color: var(--text-muted);
  cursor: pointer;
}
/* タグ別の文言一覧 */
.dt-ph-modal .dt-ph-group {
  border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-m);
  padding: 6px 10px;
  margin-bottom: 8px;
}
.dt-ph-modal .dt-ph-group.is-current {
  border-color: var(--interactive-accent);
}
.dt-ph-modal summary {
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 500;
}
.dt-ph-modal .dt-ph-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
  background: var(--background-modifier-border);
}
.dt-ph-modal .dt-ph-current {
  font-size: var(--font-ui-smaller);
  font-weight: normal;
  color: var(--text-accent);
}
.dt-ph-modal .dt-ph-list {
  display: grid;
  grid-template-columns: 90px minmax(0, 1fr);
  gap: 2px 8px;
  font-size: var(--font-ui-smaller);
  margin: 6px 0 2px;
}
.dt-ph-modal .dt-ph-list dt {
  color: var(--text-muted);
}
.dt-ph-modal .dt-ph-list dd {
  margin: 0;
}
.dt-ph-modal .dt-ph-list dd.is-inherited {
  color: var(--text-muted);
}
/* 設定: タグの説明・文言の入力欄 */
.dt-tag-color-row .dt-tag-hint-input {
  min-width: 220px;
}
.dt-tag-schema-ph-row .dt-schema-ph {
  width: 100%;
  min-width: 320px;
  font-size: var(--font-ui-smaller);
}

/* ---------- スマホ（Obsidian の .is-phone）のダイアログ調整 ----------
   Obsidian のスマホ用CSSは設定行を縦積みにし、input を幅100%に広げる
   （.is-phone .setting-item-control input { width: 100% }）。
   複数の入力を横に並べる行はそのままだとはみ出して編集しづらいので、
   1行に収まるよう幅の配分を戻す（詳細度でこちらを勝たせる） */
.is-phone .dt-modal .setting-item-control input.dt-time-input {
  width: auto;
  flex: 1 1 0;
  min-width: 0;
}
.is-phone .dt-modal .setting-item-control input.dt-title-input,
.is-phone .dt-modal .setting-item-control input.dt-date-field,
.is-phone .dt-modal .setting-item-control input.dt-actual-input,
.is-phone .dt-modal .setting-item-control input.dt-ticket-input {
  width: auto;
  flex: 1 1 auto;
  min-width: 0;
}

/* ---------- モバイルの編集ダイアログ（TickTick 風のシンプル表示） ----------
   上段は「丸い完了チェック + 日時サマリー」の1行だけ。日付・時間・実績の入力欄は
   サマリーのタップで開閉し、空の任意項目は「＋ 項目を追加」のメニューにまとまる
   （.dt-modal-mobile は modal.ts が Platform.isMobile のときに付ける） */
.dt-modal-mobile .dt-m-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 2px 0 4px;
}
/* 丸い完了チェック（TickTick のチェック円と同じ役割） */
.dt-modal-mobile button.dt-m-done {
  flex: 0 0 auto;
  width: 26px;
  height: 26px;
  min-height: 0;
  padding: 0;
  border-radius: 50%;
  border: 2px solid var(--text-faint);
  background: transparent;
  box-shadow: none;
  display: flex;
  align-items: center;
  justify-content: center;
  color: transparent; /* 未完了はチェックを見せない */
  cursor: pointer;
}
.dt-modal-mobile button.dt-m-done svg {
  width: 15px;
  height: 15px;
}
.dt-modal-mobile button.dt-m-done.is-done {
  background: var(--interactive-accent);
  border-color: var(--interactive-accent);
  color: var(--text-on-accent);
}
/* 日時サマリー（アクセント色の1行。タップで編集欄を開閉） */
.dt-modal-mobile button.dt-m-sched {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 4px;
  padding: 6px 0;
  background: transparent;
  border: none;
  box-shadow: none;
  color: var(--text-accent);
  font-size: var(--font-ui-medium);
  cursor: pointer;
}
.dt-modal-mobile .dt-m-sched-text {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dt-modal-mobile button.dt-m-sched.is-error .dt-m-sched-text {
  color: var(--text-error);
}
.dt-modal-mobile .dt-m-sched-chevron {
  display: flex;
  align-items: center;
  color: var(--text-faint);
}
.dt-modal-mobile .dt-m-sched-chevron svg {
  width: 16px;
  height: 16px;
  transition: transform 120ms ease;
}
.dt-modal-mobile button.dt-m-sched.is-open .dt-m-sched-chevron svg {
  transform: rotate(180deg);
}
/* 開いた日付・時間・実績の欄はひとつの枠にまとめる */
.dt-modal-mobile .dt-m-sched-body {
  border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-m);
  padding: 2px 10px;
  margin-bottom: 8px;
}
/* タイトルはラベルを出さず、大きめの枠なし入力に */
.dt-modal-mobile .dt-title-setting .setting-item-info {
  display: none;
}
.dt-modal-mobile .dt-title-setting input.dt-title-input {
  font-size: 1.25em;
  font-weight: 600;
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  padding-left: 0;
  padding-right: 0;
}
/* タグもラベルなしでチップだけを並べる */
.dt-modal-mobile .dt-tag-setting .setting-item-info {
  display: none;
}
/* 行間は少し詰める */
.dt-modal-mobile .setting-item {
  padding: 6px 0;
}
/* 「＋ 項目を追加」ボタン（チップの羅列の代わり。Obsidian のスマホCSSの幅100%を戻す） */
.dt-modal-mobile .dt-add-fields {
  border-top: none;
  padding-top: 4px;
}
.dt-modal-mobile button.dt-add-field-menu-btn {
  width: auto !important;
  flex: 0 1 auto !important;
  min-height: 0;
  padding: 6px 14px;
}
/* 「削除」「ノートで開く」のアイコンボタン */
.dt-modal-mobile .dt-modal-buttons button.dt-m-icon-btn {
  width: auto !important;
  flex: 0 0 auto !important;
  padding: 6px 12px;
}
.dt-modal-mobile .dt-modal-buttons button.dt-m-icon-btn svg {
  width: 18px;
  height: 18px;
}
.dt-tag-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.dt-tag-chip {
  height: auto;
  min-height: 0;
  padding: 2px 10px 2px 12px;
  border-radius: var(--radius-l);
  font-size: var(--font-ui-smaller);
  background: transparent;
  color: var(--text-normal);
  border: 1px solid var(--dt-chip-color, var(--background-modifier-border));
  box-shadow: inset 4px 0 0 var(--dt-chip-color, transparent);
  cursor: pointer;
}
.dt-tag-chip:hover {
  background: var(--background-modifier-hover);
}
.dt-tag-chip.is-selected {
  background: var(--dt-chip-color, var(--interactive-accent));
  color: var(--dt-chip-fg, var(--text-on-accent));
  box-shadow: none;
}
/* スマホでは Obsidian がダイアログ内のボタンを幅100%に広げるため、
   タグが1行1個の縦積みになって選択エリアが縦に長すぎた。
   チップは文字幅のまま横に並べて折り返す（タップの的として高さは少し確保する）。
   幅の指定は Obsidian 側が !important 相当の強さで勝つため、こちらも !important で上書きする */
.is-phone .dt-tag-chips {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.is-phone .dt-tag-chips button.dt-tag-chip {
  width: auto !important;
  min-width: 0 !important;
  max-width: 100%;
  flex: 0 1 auto !important;
  display: inline-flex;
  align-items: center;
  min-height: 0;
  padding: 5px 12px 5px 14px;
}
/* ステップ */
.dt-steps {
  padding: 6px 0 4px;
  border-bottom: 1px solid var(--background-modifier-border);
  margin-bottom: 4px;
}
.dt-steps-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.dt-steps-name {
  font-size: var(--font-ui-medium);
}
.dt-steps-count {
  margin-left: 8px;
  color: var(--text-muted);
  font-size: var(--font-ui-smaller);
}
.dt-steps-progress {
  height: 4px;
  background: var(--background-modifier-border);
  border-radius: 2px;
  margin: 8px 0 6px;
  overflow: hidden;
}
.dt-steps-progress.is-empty {
  opacity: 0.4;
}
.dt-steps-progress > div {
  height: 100%;
  background: var(--interactive-accent);
  transition: width 120ms ease;
}
.dt-steps-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.dt-step {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--background-secondary);
  border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-s);
  padding: 3px 6px 3px 4px;
}
.dt-step.is-dragging {
  opacity: 0.5;
  border-style: dashed;
}
.dt-step-placeholder {
  background: transparent;
  border: 1.5px dashed var(--interactive-accent);
}
.dt-step-grip {
  color: var(--text-faint);
  cursor: grab;
  display: flex;
  align-items: center;
  touch-action: none;
}
.dt-step-grip:active {
  cursor: grabbing;
}
.dt-step-grip svg,
.dt-step-check svg,
.dt-step-delete svg {
  width: 16px;
  height: 16px;
}
.dt-step-check {
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
}
.dt-step.is-done .dt-step-check {
  color: var(--interactive-accent);
}
.dt-step-text {
  flex: 1 1 auto;
  min-width: 0;
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  padding: 2px 4px !important;
  height: auto;
}
.dt-step.is-done .dt-step-text {
  color: var(--text-muted);
  text-decoration: line-through;
}
.dt-step-delete {
  color: var(--text-faint);
  cursor: pointer;
  display: flex;
  align-items: center;
  opacity: 0;
}
.dt-step:hover .dt-step-delete,
.dt-step:focus-within .dt-step-delete {
  opacity: 1;
}
.dt-step-delete:hover {
  color: var(--text-error);
}
.dt-step-add {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
  padding-left: 4px;
}
.dt-step-add-icon {
  color: var(--text-muted);
  display: flex;
  align-items: center;
}
.dt-step-add-icon svg {
  width: 16px;
  height: 16px;
}
.dt-step-add input {
  flex: 1 1 auto;
}

/* 定期タスクの一覧ダイアログ */
.dt-recurring-empty {
  color: var(--text-muted);
  padding: 8px 0 12px;
  line-height: 1.5;
}
.dt-recurring-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin: 4px 0 8px;
  max-height: 50vh;
  overflow-y: auto;
}
.dt-recurring-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-s);
  background: var(--background-secondary);
}
.dt-recurring-item.is-disabled .dt-recurring-title,
.dt-recurring-item.is-disabled .dt-recurring-desc {
  opacity: 0.45;
}
.dt-recurring-toggle {
  display: flex;
  align-items: center;
  color: var(--text-muted);
  cursor: pointer;
}
.dt-recurring-item:not(.is-disabled) .dt-recurring-toggle {
  color: var(--interactive-accent);
}
.dt-recurring-toggle svg {
  width: 18px;
  height: 18px;
}
.dt-recurring-body {
  flex: 1 1 auto;
  min-width: 0;
  cursor: pointer;
}
.dt-recurring-title {
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* 今日の反映状態（定期タスクの一覧） */
.dt-recurring-status {
  font-size: var(--font-ui-smaller);
  color: var(--text-faint);
  margin-top: 1px;
}
/* 自動反映オフの警告 */
.dt-recurring-warn {
  margin-bottom: 8px;
  padding: 6px 10px;
  border-radius: var(--radius-s);
  border: 1px solid var(--background-modifier-border);
  background: rgba(var(--color-yellow-rgb, 224, 172, 0), 0.12);
  color: var(--text-normal);
  font-size: var(--font-ui-smaller);
  line-height: 1.5;
}

.dt-recurring-desc {
  font-size: var(--font-ui-smaller);
  color: var(--text-muted);
}

/* 定期タスクの曜日 */
.dt-weekday-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.dt-weekday-chip {
  padding: 2px 9px;
  box-shadow: none;
  border-color: var(--background-modifier-border);
}
.dt-weekday-chip.is-sunday {
  color: var(--color-red);
}
.dt-weekday-chip.is-saturday {
  color: var(--color-blue);
}
.dt-weekday-chip.is-selected {
  background: var(--interactive-accent);
  color: var(--text-on-accent);
  border-color: var(--interactive-accent);
}
.dt-weekday-presets {
  display: flex;
  gap: 4px;
  margin-left: 8px;
}
.dt-weekday-preset {
  height: auto;
  min-height: 0;
  padding: 1px 8px;
  font-size: var(--font-ui-smaller);
  background: transparent;
  color: var(--text-muted);
  box-shadow: none;
  border: none;
  text-decoration: underline;
  cursor: pointer;
}
.dt-weekday-preset:hover {
  color: var(--text-normal);
  background: transparent;
}
.dt-modal-tilde {
  margin: 0 8px;
  color: var(--text-muted);
}
.dt-modal .setting-item-description.is-error {
  color: var(--text-error);
}
.dt-modal-buttons .setting-item-control {
  gap: 8px;
  flex-wrap: wrap; /* ボタンが多いダイアログ（未完了ステップの確認など）でも収まるように */
}
/* 自動保存の状態（ボタン行の左側に出す） */
.dt-modal .dt-modal-buttons .setting-item-description.dt-autosave-error {
  color: var(--text-error);
}

/* ふりかえり（編集ダイアログの欄）: 名前を上、入力欄を全幅に */
.dt-modal .dt-retro-setting {
  display: block;
}
.dt-modal .dt-retro-setting .setting-item-info {
  margin-bottom: 6px;
}
.dt-modal .dt-retro-setting .setting-item-control {
  width: 100%;
  justify-content: stretch;
}
.dt-retro-field {
  width: 100%;
  min-height: 36px;
  max-height: 220px;
  resize: none;
  overflow-y: auto;
  font-family: inherit;
  font-size: var(--font-ui-medium);
  line-height: 1.5;
  padding: 7px 10px;
  transition: min-height 120ms ease;
}
/* フォーカス中は最低でも4行ぶんに広がる */
.dt-retro-field.is-active {
  min-height: 110px;
}
/* 詳細は Markdown を書くので等幅寄りにして、広がりも大きめに */
.dt-details-field {
  font-family: var(--font-monospace);
  font-size: var(--font-ui-small);
  max-height: 320px;
}
.dt-details-field.is-active {
  min-height: 140px;
}

/* 結果とふりかえりの入力促進ポップアップ */
.dt-retro-modal {
  width: 560px;
  max-width: 90vw;
}
/* 未完了ステップの確認ダイアログの一覧 */
.dt-remaining-list {
  margin: 8px 0 4px;
  padding-inline-start: 22px;
}
.dt-remaining-list li {
  line-height: 1.6;
}
.dt-retro-lead {
  line-height: 1.6;
  color: var(--text-normal);
}
.dt-retro-input {
  width: 100%;
  min-height: 120px;
  max-height: 320px;
  resize: vertical;
  font-family: inherit;
  font-size: var(--font-ui-medium);
  line-height: 1.5;
  padding: 8px 10px;
}

/* ---------- タイマーのダイアログ ---------- */
.dt-timer-presets {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 4px 0 10px;
}
.dt-timer-preset {
  height: auto;
  min-height: 0;
  padding: 3px 12px;
  border-radius: var(--radius-l);
  font-size: var(--font-ui-small);
}
.dt-timer-remaining {
  font-size: 2.4em;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  text-align: center;
  padding: 10px 0 4px;
}
.dt-timer-label {
  text-align: center;
  color: var(--text-muted);
  padding-bottom: 8px;
}
.dt-timer-done-text {
  padding: 8px 0 12px;
}

/* ---------- 画面内の通知バナー（右下に重ねる） ---------- */
.dt-alert-host {
  position: fixed;
  right: 20px;
  bottom: 40px;
  z-index: var(--layer-notice, 1000);
  display: flex;
  flex-direction: column-reverse;
  gap: 10px;
  pointer-events: none;
  max-width: min(420px, calc(100vw - 40px));
}
.dt-alert {
  pointer-events: auto;
  width: 380px;
  max-width: 100%;
  background: var(--background-primary);
  color: var(--text-normal);
  border: 1px solid var(--background-modifier-border);
  border-left: 6px solid var(--interactive-accent);
  border-radius: var(--radius-m);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  padding: 14px 16px 12px;
  cursor: pointer;
  opacity: 0;
  transform: translateX(24px);
  transition: opacity 180ms ease, transform 180ms ease;
}
.dt-alert.is-shown {
  opacity: 1;
  transform: none;
}
.dt-alert.is-leaving {
  opacity: 0;
  transform: translateX(24px);
}
.dt-alert-title {
  font-size: 1.15em;
  font-weight: 700;
  line-height: 1.3;
}
.dt-alert-body {
  margin-top: 4px;
  font-size: var(--font-ui-medium);
  color: var(--text-muted);
}
.dt-alert-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  margin-top: 10px;
}
.dt-alert-buttons button {
  height: auto;
  min-height: 0;
  padding: 3px 10px;
  font-size: var(--font-ui-small);
}
@media (prefers-reduced-motion: reduce) {
  .dt-alert {
    transition: none;
  }
}

.dt-modal .dt-ticket-input {
  width: 140px;
}
.dt-modal .dt-ticket-link {
  color: var(--text-accent);
  word-break: break-all;
}

/* ---------- 設定画面 ---------- */
.dt-tag-color-row .setting-item-name {
  display: flex;
  align-items: center;
  gap: 8px;
}
.dt-tag-swatch {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1px solid var(--background-modifier-border);
}
.dt-tag-color-row input[type="text"] {
  width: 140px;
}

.dt-recurring-row.is-disabled .setting-item-name,
.dt-recurring-row.is-disabled .setting-item-description {
  opacity: 0.5;
}
.dt-setting-empty {
  color: var(--text-faint);
  font-size: var(--font-ui-smaller);
  padding: 4px 0 10px;
}

.dt-member-row .dt-member-folder {
  width: 200px;
}
.dt-tracker-row .dt-tracker-url {
  width: 280px;
}
/* タグ別フィールドの設定行（タグ / 必須 / 候補の3入力） */
.dt-tag-schema-row .dt-schema-tag {
  width: 110px;
}
.dt-tag-schema-row .dt-schema-fields {
  width: 190px;
}

.dt-setting-preview {
  margin-top: 4px;
  color: var(--text-muted);
  font-family: var(--font-monospace);
  font-size: var(--font-ui-smaller);
}

/* ---------- ノート内の見出しに付けたタグ ---------- */
/* タスクの見出し（## タイトル #タグ）のタグが見出しの文字サイズを引き継いで大きくなるのを抑える。
   注: 見出し内のタグ全般に効きます */
.markdown-source-view.mod-cm6 .HyperMD-header .cm-hashtag,
.markdown-preview-view :is(h1, h2, h3, h4, h5, h6) a.tag {
  font-size: 0.55em;
  font-weight: 500;
  vertical-align: middle;
  line-height: 1;
}
.markdown-source-view.mod-cm6 .HyperMD-header .cm-hashtag-begin {
  padding-left: 0.5em;
}
.markdown-source-view.mod-cm6 .HyperMD-header .cm-hashtag-end {
  padding-right: 0.5em;
}
.markdown-preview-view :is(h1, h2, h3, h4, h5, h6) a.tag {
  padding: 0.15em 0.6em;
}

/* ---------- 定期タスクの管理画面 ---------- */
.dt-rec-view {
  padding: 0;
  overflow: hidden;
}
.dt-rec-layout {
  display: flex;
  height: 100%;
  min-height: 0;
}
/* 左: ルール一覧 */
.dt-rec-side {
  flex: 0 0 260px;
  min-width: 200px;
  border-right: 1px solid var(--background-modifier-border);
  padding: 12px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.dt-rec-side-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.dt-rec-side-title {
  font-weight: 600;
  font-size: var(--font-ui-medium);
}
.dt-rec-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.dt-rec-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-s);
  background: var(--background-secondary);
  cursor: pointer;
}
.dt-rec-item:hover {
  background: var(--background-modifier-hover);
}
.dt-rec-item.is-selected {
  border-color: var(--interactive-accent);
  box-shadow: 0 0 0 1px var(--interactive-accent);
}
.dt-rec-item.is-disabled .dt-rec-item-title,
.dt-rec-item.is-disabled .dt-rec-item-desc {
  opacity: 0.45;
}
.dt-rec-item-dot {
  display: flex;
  align-items: center;
  color: var(--text-muted);
}
.dt-rec-item:not(.is-disabled) .dt-rec-item-dot {
  color: var(--interactive-accent);
}
.dt-rec-item-dot svg {
  width: 16px;
  height: 16px;
}
.dt-rec-item-body {
  flex: 1 1 auto;
  min-width: 0;
}
.dt-rec-item-title {
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dt-rec-item-desc {
  font-size: var(--font-ui-smaller);
  color: var(--text-muted);
}
/* 右: 編集フォームと今後の予定 */
.dt-rec-main {
  flex: 1 1 auto;
  min-width: 0;
  overflow-y: auto;
  padding: 12px 16px 24px;
}
.dt-rec-placeholder {
  color: var(--text-muted);
  padding: 24px 8px;
  line-height: 1.6;
}
.dt-rec-section-title {
  font-weight: 600;
  font-size: var(--font-ui-medium);
  margin: 8px 0 4px;
}
.dt-rec-editor .setting-item {
  border-top: none;
  padding: 6px 0;
}
.dt-rec-editor-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin: 8px 0 4px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--background-modifier-border);
}
.dt-rec-danger {
  color: var(--text-error);
}
.dt-rec-view .setting-item-description.is-error {
  color: var(--text-error);
}
/* 共通の詳細・個別詳細の入力欄: 名前を上、入力欄を全幅に */
.dt-rec-details-setting {
  display: block;
}
.dt-rec-details-setting .setting-item-info {
  margin-bottom: 6px;
}
.dt-rec-details-setting .setting-item-control {
  width: 100%;
  justify-content: stretch;
}
.dt-rec-details-field {
  width: 100%;
  min-height: 60px;
  max-height: 280px;
  resize: vertical;
  font-family: var(--font-monospace);
  font-size: var(--font-ui-small);
  line-height: 1.5;
  padding: 7px 10px;
}
/* 今後の予定（発生日一覧） */
.dt-rec-occ-hint {
  color: var(--text-muted);
  font-size: var(--font-ui-smaller);
  margin-bottom: 8px;
  line-height: 1.5;
}
.dt-rec-occ-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.dt-rec-occ-row {
  border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-s);
  background: var(--background-secondary);
}
.dt-rec-occ-row.is-skipped {
  opacity: 0.75;
}
.dt-rec-occ-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 8px;
  min-height: 32px;
}
.dt-rec-occ-row.is-editable .dt-rec-occ-head {
  cursor: pointer;
}
.dt-rec-occ-caret {
  display: flex;
  align-items: center;
  width: 16px;
  color: var(--text-muted);
}
.dt-rec-occ-caret svg {
  width: 14px;
  height: 14px;
}
.dt-rec-occ-date {
  flex: 0 0 auto;
  min-width: 72px;
  font-weight: 600;
}
.dt-rec-occ-date.is-today {
  color: var(--interactive-accent);
}
.dt-rec-occ-time {
  flex: 0 0 auto;
  min-width: 96px;
  color: var(--text-muted);
  font-size: var(--font-ui-smaller);
  font-variant-numeric: tabular-nums;
}
.dt-rec-occ-badge {
  flex: 1 1 auto;
  min-width: 0;
  font-size: var(--font-ui-smaller);
  color: var(--text-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dt-rec-occ-badge.is-applied,
.dt-rec-occ-badge.is-applied-custom {
  color: var(--color-green);
}
.dt-rec-occ-badge.is-pending-custom,
.dt-rec-occ-badge.is-applied-custom {
  font-weight: 600;
}
.dt-rec-occ-badge.is-skipped {
  color: var(--text-faint);
  text-decoration: line-through;
}
.dt-rec-occ-badge.is-missing {
  color: var(--color-orange, var(--text-warning, var(--text-muted)));
}
.dt-rec-occ-actions {
  display: flex;
  gap: 4px;
  flex: 0 0 auto;
}
.dt-rec-occ-btn {
  height: auto;
  min-height: 0;
  padding: 2px 8px;
  font-size: var(--font-ui-smaller);
  box-shadow: none;
}
/* 個別詳細エディタ */
.dt-rec-occ-editor {
  border-top: 1px solid var(--background-modifier-border);
  padding: 8px 10px 10px 32px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.dt-rec-occ-editor-hint {
  color: var(--text-faint);
  font-size: var(--font-ui-smaller);
}
